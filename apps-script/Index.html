<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; --ink:#13233a; --muted:#61718a; --line:#dbe3ed; --blue:#2654c7; --bg:#f3f6fb; --green:#16794a; --red:#b42318; --amber:#8a5a00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { background:#10253e; color:#fff; padding:20px max(18px,calc((100vw - 900px)/2)); }
    header h1 { font-size:22px; margin:0; }
    header p { color:#d3deeb; margin:5px 0 0; font-size:14px; }
    main { max-width:900px; margin:20px auto; padding:0 16px 40px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin:16px 0; box-shadow:0 3px 12px #1b36520a; }
    label { display:block; font-size:14px; font-weight:700; margin:12px 0 6px; }
    input { width:100%; border:1px solid #aebdce; border-radius:8px; padding:11px 12px; font:inherit; color:var(--ink); background:#fff; }
    input:focus { outline:3px solid #c9d8ff; border-color:var(--blue); }
    button { border:0; border-radius:8px; background:var(--blue); color:#fff; padding:11px 15px; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#eaf0fb; color:#193c85; }
    button:disabled { opacity:.55; cursor:wait; }
    .scanRow { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }
    .dateRow { max-width:280px; }
    .small { color:var(--muted); font-size:13px; margin:7px 0; }
    #status { min-height:24px; white-space:pre-wrap; margin-top:14px; }
    #status.error { color:var(--red); font-weight:700; }
    #status.success { color:var(--green); font-weight:700; }
    #queue { list-style:none; margin:12px 0 0; padding:0; }
    #queue li { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; border-top:1px solid var(--line); padding:10px 0; }
    .cert { font-weight:750; font-variant-numeric:tabular-nums; }
    .detail { display:block; color:var(--muted); font-size:13px; white-space:pre-wrap; }
    .badge { font-size:13px; font-weight:700; white-space:nowrap; }
    .waiting { color:#536579; } .running { color:var(--blue); } .done { color:var(--green); } .hold { color:var(--amber); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    @media(max-width:600px) { .scanRow { grid-template-columns:1fr; } #queue li { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>PSA バーコード価格調査</h1>
    <p>連続スキャン → 一括検索 → PSA・ALT確認 → 日付まとめへ記入</p>
  </header>
  <main>
    <section class="card">
      <h2>鑑定番号を読み取る</h2>
      <label for="targetDate">記入する日付</label>
      <div class="dateRow"><input id="targetDate" type="date"></div>
      <label for="cert">PSA証明番号</label>
      <div class="scanRow">
        <input id="cert" inputmode="numeric" autocomplete="off" placeholder="バーコードを読むと自動でリストに追加">
        <button id="addButton" type="button" class="secondary">手動で追加</button>
      </div>
      <p class="small">スキャナーのEnter送信がなくても、入力が止まると自動追加します。読み取り後、約0.5秒でリストに入ります。</p>
      <ul id="queue"></ul>
      <div class="actions">
        <button id="processButton" type="button">検索して反映</button>
        <button id="clearButton" type="button" class="secondary">リストをクリア</button>
      </div>
      <div id="status" class="small" aria-live="polite">ページを起動しています…</div>
    </section>
  </main>
<script>
(function() {
  'use strict';

  var queue = [];
  var popupWindow = null;
  var activeIndex = -1;
  var activeStage = '';
  var activeNonce = '';
  var targetSheetName = '';
  var busy = false;
  var autoAddTimer = null;
  var stageTimer = null;

  var $ = function(id) { return document.getElementById(id); };

  function setStatus(message, type) {
    var status = $('status');
    status.textContent = message;
    status.className = type || 'small';
  }

  function digits(value) {
    return String(value || '').replace(/\D/g, '');
  }

  function renderQueue() {
    var list = $('queue');
    list.textContent = '';
    queue.forEach(function(item, index) {
      var li = document.createElement('li');
      var left = document.createElement('div');
      var cert = document.createElement('span');
      cert.className = 'cert';
      cert.textContent = item.cert;
      var detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = item.detail || '';
      left.appendChild(cert);
      left.appendChild(detail);

      var right = document.createElement('div');
      var badge = document.createElement('span');
      badge.className = 'badge ' + (item.state || 'waiting');
      badge.textContent = item.status;
      right.appendChild(badge);

      if (!busy && item.state !== 'done') {
        var remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'secondary';
        remove.textContent = '削除';
        remove.addEventListener('click', function() {
          queue.splice(index, 1);
          renderQueue();
        });
        right.appendChild(remove);
      }
      li.appendChild(left);
      li.appendChild(right);
      list.appendChild(li);
    });
  }

  function addCert() {
    if (busy) return;
    clearTimeout(autoAddTimer);
    var input = $('cert');
    var cert = digits(input.value);
    if (!/^\d{6,12}$/.test(cert)) {
      if (cert.length) setStatus('鑑定番号は6〜12桁で読み取ってください。', 'error');
      input.focus();
      return;
    }
    input.value = '';
    if (queue.some(function(item) { return item.cert === cert; })) {
      setStatus('鑑定番号 ' + cert + ' はすでにリストにあります。');
      input.focus();
      return;
    }
    queue.push({ cert: cert, state: 'waiting', status: '待機中', detail: '' });
    renderQueue();
    setStatus(cert + ' を追加しました。続けてスキャンしてください。');
    input.focus();
  }

  function onScannerInput() {
    if (busy) return;
    clearTimeout(autoAddTimer);
    autoAddTimer = setTimeout(function() {
      var cert = digits($('cert').value);
      if (/^\d{6,12}$/.test(cert)) addCert();
    }, 600);
  }

  function setItem(index, state, status, detail) {
    if (!queue[index]) return;
    queue[index].state = state;
    queue[index].status = status;
    queue[index].detail = detail || '';
    renderQueue();
  }

  function armStageTimeout(index, stage, message) {
    clearTimeout(stageTimer);
    stageTimer = setTimeout(function() {
      if (!busy || activeIndex !== index || activeStage !== stage) return;
      setItem(index, 'hold', '保留', message);
      processNext(index + 1);
    }, 60000);
  }

  function startBatch() {
    if (busy) return;
    if (!queue.length) {
      setStatus('鑑定番号がリストにありません。まずバーコードを読み取ってください。', 'error');
      $('cert').focus();
      return;
    }
    if (!$('targetDate').value) {
      setStatus('記入する日付を選択してください。', 'error');
      return;
    }

    popupWindow = window.open('about:blank', 'psaAltBatchSearch');
    if (!popupWindow) {
      setStatus('検索用ポップアップがブロックされました。このWebアプリのポップアップを許可してください。', 'error');
      return;
    }

    busy = true;
    $('processButton').disabled = true;
    $('addButton').disabled = true;
    $('clearButton').disabled = true;
    setStatus('日付まとめシートを準備しています…');

    activeStage = 'sheet';
    armStageTimeout(-1, 'sheet', 'Apps Scriptから応答がありません。認可状態と対象シートの紐づけを確認してください。');
    google.script.run
      .withSuccessHandler(function(result) {
        clearTimeout(stageTimer);
        if (!busy) return;
        targetSheetName = result.sheet;
        processNext(0);
      })
      .withFailureHandler(function(error) {
        clearTimeout(stageTimer);
        finishBatch('シート準備エラー: ' + errorText(error));
      })
      .ensureSummarySheet($('targetDate').value);
  }

  function processNext(startIndex) {
    var index = startIndex;
    while (index < queue.length && queue[index].state === 'done') index++;
    if (index >= queue.length) {
      finishBatch('一括処理が完了しました。');
      return;
    }
    if (!popupWindow || popupWindow.closed) {
      setItem(index, 'hold', '保留', '検索用ポップアップが閉じられました。');
      return processNext(index + 1);
    }

    activeIndex = index;
    activeStage = 'psa-request';
    setItem(index, 'running', 'PSA照合を開始…', '');

    armStageTimeout(index, 'psa-request', 'PSA照合の準備でApps Scriptから応答がありません。');
    google.script.run
      .withSuccessHandler(function(request) {
        if (!busy || activeIndex !== index) return;
        clearTimeout(stageTimer);
        activeNonce = request.nonce;
        activeStage = 'psa-page';
        setItem(index, 'running', 'PSA公式を確認中…', '');
        popupWindow.location.href = request.psaUrl;
        armStageTimeout(index, 'psa-page', 'PSAページから返事がありません。PSA用Tampermonkeyスクリプトが有効か確認してください。');
      })
      .withFailureHandler(function(error) {
        if (!busy || activeIndex !== index) return;
        clearTimeout(stageTimer);
        setItem(index, 'hold', '保留', 'PSA照合の準備: ' + errorText(error));
        processNext(index + 1);
      })
      .lookupPsaCert(queue[index].cert);
  }

  function handlePsaResult(event, data, bridged) {
    if (!bridged && event.origin !== 'https://www.psacard.com') return;
    if (activeStage !== 'psa-page') return;
    var index = activeIndex;
    var cert = queue[index].cert;
    if (String(data.cert) !== cert || !data.ok) {
      clearTimeout(stageTimer);
      setItem(index, 'hold', '保留', data.reason || 'PSA公式ページで鑑定情報を確認できません。');
      processNext(index + 1);
      return;
    }

    var psa = {
      cert: cert,
      name: String(data.name || '').trim(),
      grade: String(data.grade || '').trim(),
      imageUrl: String(data.imageUrl || ''),
      url: String(data.url || '')
    };
    if (!psa.name || !/^PSA \d+(?:\.5)?$/.test(psa.grade) || !isCanonicalPsaUrl(psa.url, cert)) {
      clearTimeout(stageTimer);
      setItem(index, 'hold', '保留', 'PSA番号・カード名・グレードを照合できません。');
      processNext(index + 1);
      return;
    }

    clearTimeout(stageTimer);
    queue[index].psa = psa;
    activeStage = 'alt-page';
    setItem(index, 'running', 'ALT成約を検索中…', psa.name + ' / ' + psa.grade);

    var altUrl = new URL('https://alt.xyz/browse');
    altUrl.searchParams.set('query', cert);
    altUrl.searchParams.set('psaGrade', psa.grade.replace(/^PSA\s*/i, ''));
    altUrl.searchParams.set('psaBatch', '1');
    altUrl.searchParams.set('psaNonce', activeNonce);
    altUrl.searchParams.set('psaName', psa.name);
    popupWindow.location.href = altUrl.href;
    armStageTimeout(index, 'alt-page', 'ALTから返事がありません。ALT用Tampermonkeyスクリプトや検索ページを確認してください。');
  }

  function handleAltResult(event, data, bridged) {
    if (!bridged && event.origin !== 'https://alt.xyz') return;
    if (activeStage !== 'alt-page') return;
    var index = activeIndex;
    var psa = queue[index].psa;
    if (!psa || String(data.cert) !== psa.cert || String(data.grade) !== psa.grade) {
      clearTimeout(stageTimer);
      setItem(index, 'hold', '保留', 'ALTの鑑定番号またはPSAグレードが一致しません。');
      processNext(index + 1);
      return;
    }
    if (!data.ok || !Array.isArray(data.sales) || data.sales.length < 2) {
      clearTimeout(stageTimer);
      setItem(index, 'hold', '保留', data.reason || '同一条件の成約2件を確認できません。価格は記入していません。');
      processNext(index + 1);
      return;
    }

    activeStage = 'sheet-write';
    setItem(index, 'running', 'シートへ記入中…',
      data.sales[0].date + ' $' + data.sales[0].price + ' / ' +
      data.sales[1].date + ' $' + data.sales[1].price);
    armStageTimeout(index, 'sheet-write', 'シート記入でApps Scriptから応答がありません。');

    google.script.run
      .withSuccessHandler(function(result) {
        if (!busy || activeIndex !== index || activeStage !== 'sheet-write') return;
        clearTimeout(stageTimer);
        setItem(index, 'done', '反映済み',
          result.sheet + ' ' + result.row + '行目 / ' +
          result.name + ' / ' + result.grade + ' / 採用 $' + result.adopted);
        processNext(index + 1);
      })
      .withFailureHandler(function(error) {
        if (!busy || activeIndex !== index || activeStage !== 'sheet-write') return;
        clearTimeout(stageTimer);
        setItem(index, 'hold', '保留', 'シート記入: ' + errorText(error));
        processNext(index + 1);
      })
      .writePricedCard({
        cert: psa.cert,
        psa: psa,
        targetSheet: targetSheetName,
        altCert: data.cert,
        altGrade: data.grade,
        altName: data.title || '',
        altUrl: data.url || '',
        sales: data.sales,
        matchConfirmed: true
      });
  }

  function isCanonicalPsaUrl(value, cert) {
    try {
      var url = new URL(value);
      return url.protocol === 'https:' &&
        url.hostname === 'www.psacard.com' &&
        url.pathname.toLowerCase() === '/cert/' + cert + '/psa';
    } catch (e) {
      return false;
    }
  }

  function onMessage(event) {
    var data = event.data;
    var fromPopup = !!popupWindow && event.source === popupWindow;
    var fromTampermonkeyBridge = event.source === window && event.origin === window.location.origin;
    if (!busy || !popupWindow || (!fromPopup && !fromTampermonkeyBridge) || !data) return;
    if (String(data.nonce || '') !== activeNonce || activeIndex < 0) return;

    if (data.type === 'PSA_CERT_RESULT') {
      handlePsaResult(event, data, fromTampermonkeyBridge);
    } else if (data.type === 'PSA_ALT_BATCH_RESULT') {
      handleAltResult(event, data, fromTampermonkeyBridge);
    }
  }

  function finishBatch(message) {
    clearTimeout(stageTimer);
    busy = false;
    activeIndex = -1;
    activeStage = '';
    activeNonce = '';
    $('processButton').disabled = false;
    $('addButton').disabled = false;
    $('clearButton').disabled = false;
    if (popupWindow && !popupWindow.closed) popupWindow.close();
    popupWindow = null;
    renderQueue();
    var done = queue.filter(function(item) { return item.state === 'done'; }).length;
    var held = queue.filter(function(item) { return item.state === 'hold'; }).length;
    setStatus(message + '\n反映 ' + done + '件 / 保留 ' + held + '件。保留理由は各番号の下に表示しています。',
      held ? '' : 'success');
    $('cert').focus();
  }

  function errorText(error) {
    return error && error.message ? error.message : String(error || '不明なエラー');
  }

  $('addButton').addEventListener('click', addCert);
  $('processButton').addEventListener('click', startBatch);
  $('clearButton').addEventListener('click', function() {
    if (busy) return;
    queue = [];
    renderQueue();
    setStatus('リストをクリアしました。');
    $('cert').focus();
  });
  $('cert').addEventListener('input', onScannerInput);
  $('cert').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      clearTimeout(autoAddTimer);
      addCert();
    }
  });
  window.addEventListener('message', onMessage);

  $('targetDate').value = [
    new Date().getFullYear(),
    String(new Date().getMonth() + 1).padStart(2, '0'),
    String(new Date().getDate()).padStart(2, '0')
  ].join('-');
  $('cert').focus();
  setStatus('準備完了です。バーコードを読むと自動でリストに追加されます。');
})();
</script>
</body>
</html>
