<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; --ink:#13233a; --muted:#61718a; --line:#dbe3ed; --blue:#2654c7; --bg:#f3f6fb; --green:#16794a; --red:#b42318; --amber:#8a5a00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { background:#10253e; color:#fff; padding:22px max(20px,calc((100vw - 960px)/2)); }
    header h1 { font-size:22px; margin:0; } header p { color:#d3deeb; margin:5px 0 0; font-size:14px; }
    main { max-width:960px; margin:22px auto; padding:0 18px 40px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin:16px 0; box-shadow:0 3px 12px #1b36520a; }
    h2 { font-size:18px; margin:0 0 14px; } label { display:block; font-size:14px; font-weight:650; margin:12px 0 6px; }
    input { width:100%; border:1px solid #aebdce; border-radius:8px; background:white; padding:11px 12px; font:inherit; color:var(--ink); }
    input:focus { outline:3px solid #c9d8ff; border-color:var(--blue); }
    button { border:0; border-radius:8px; background:var(--blue); color:white; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#eaf0fb; color:#193c85; } button.danger { background:#fff0ef; color:#9b1c13; }
    button:disabled { opacity:.55; cursor:wait; }
    .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; } .small { font-size:13px; color:var(--muted); margin:7px 0; }
    .error { color:var(--red); font-weight:600; white-space:pre-wrap; } .success { color:var(--green); font-weight:700; white-space:pre-wrap; }
    #setup { display:none; } #workflow[hidden] { display:none; }
    #queue { list-style:none; margin:12px 0 0; padding:0; } #queue li { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; border-top:1px solid var(--line); padding:10px 0; }
    .cert { font-weight:750; font-variant-numeric:tabular-nums; } .detail { display:block; font-size:13px; color:var(--muted); white-space:pre-wrap; }
    .status { font-size:13px; font-weight:700; white-space:nowrap; } .status.done { color:var(--green); } .status.hold { color:var(--amber); } .status.running { color:var(--blue); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    @media(max-width:620px) { .row { grid-template-columns:1fr; } #queue li { grid-template-columns:1fr; gap:4px; } }
  </style>
</head>
<body>
  <header><h1>PSA バーコード価格調査</h1><p>複数枚を連続スキャン →「検索して反映」でPSA・ALT確認とシート記入</p></header>
  <main>
    <section class="card" id="setup">
      <h2>初回設定</h2>
      <p class="small">対象スプレッドシートから「拡張機能 → Apps Script」を開き、<code>initializeBoundSpreadsheet</code>を一度実行してから再読み込みしてください。シートIDの入力は不要です。</p>
      <div id="setupStatus" class="error">初回の紐づけが必要です。</div>
    </section>
    <section class="card" id="workflow" hidden>
      <h2>1. 日付を選んで鑑定番号を連続スキャン</h2>
      <label for="targetDate">記入する日付</label><input id="targetDate" type="date">
      <label for="cert">PSA証明番号</label>
      <div class="row"><input id="cert" inputmode="numeric" autocomplete="off" placeholder="バーコードスキャナーで読み取り。末尾Enterでリストに追加"><button id="addButton" onclick="addCert()">リストに追加</button></div>
      <p class="small">読み取るたびに番号が下のリストへ追加されます。同じリスト内の重複番号は追加しません。</p>
      <ul id="queue"></ul>
      <div class="actions"><button id="processButton" onclick="startBatch()">検索して反映</button><button class="secondary" onclick="clearQueue()">リストをクリア</button></div>
      <div id="status" class="small" aria-live="polite"></div>
    </section>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const queue = [];
  let popup = null, activeIndex = -1, batchNonce = '', targetSheet = '', busy = false, activeTimer = null;
  const today = new Date();
  $('targetDate').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  function say(text, type='') { const el=$('status'); el.textContent=text; el.className=type||'small'; }
  function init() {
    google.script.run.withSuccessHandler(state => {
      if (!state.configured) { $('setup').style.display='block'; return; }
      $('setup').style.display='none'; $('workflow').hidden=false; $('cert').focus();
    }).withFailureHandler(err => { $('setup').style.display='block'; $('setupStatus').textContent=err.message||String(err); }).getAppState();
  }
  function addCert() {
    if (busy) return;
    const input=$('cert'), cert=input.value.replace(/\D/g,''); input.value='';
    if (!/^\d{6,12}$/.test(cert)) { say('PSA鑑定番号は6〜12桁で読み取ってください。','error'); input.focus(); return; }
    if (queue.some(x=>x.cert===cert)) { say(`鑑定番号 ${cert} はすでにリストにあります。`); input.focus(); return; }
    queue.push({cert,status:'待機中',detail:''}); renderQueue(); say(`${cert} を追加しました。続けてスキャンしてください。`); input.focus();
  }
  function renderQueue() {
    const list=$('queue'); list.innerHTML='';
    queue.forEach((item,index)=>{
      const li=document.createElement('li');
      const left=document.createElement('div'); left.innerHTML=`<span class="cert"></span><span class="detail"></span>`;
      left.querySelector('.cert').textContent=item.cert; left.querySelector('.detail').textContent=item.detail;
      const right=document.createElement('div'); right.style.display='flex'; right.style.gap='12px'; right.style.alignItems='center';
      const status=document.createElement('span'); status.className=`status ${item.kind||''}`; status.textContent=item.status; right.append(status);
      if (!busy && item.kind!=='done') { const del=document.createElement('button'); del.className='secondary'; del.textContent='削除'; del.onclick=()=>{queue.splice(index,1);renderQueue();}; right.append(del); }
      li.append(left,right); list.append(li);
    });
  }
  function clearQueue() { if (busy) return; queue.splice(0); renderQueue(); say('リストを空にしました。'); }
  function setItem(index,status,kind,detail='') { Object.assign(queue[index],{status,kind,detail}); renderQueue(); }
  function startBatch() {
    if (busy) return;
    if (!queue.length) { say('先に鑑定番号を1件以上読み取ってください。','error'); return; }
    if (!$('targetDate').value) { say('記入する日付を選択してください。','error'); return; }
    popup=window.open('about:blank','psaAltBatchSearch');
    if (!popup) { say('ALT検索画面を開けませんでした。ブラウザでこのサイトのポップアップを許可してからやり直してください。','error'); return; }
    busy=true; $('processButton').disabled=true; $('addButton').disabled=true;
    batchNonce=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
    say('日付まとめシートを準備しています…');
    google.script.run.withSuccessHandler(result=>{
      targetSheet=result.sheet; processNext(0);
    }).withFailureHandler(err=>finishBatch(`シート準備エラー: ${err.message||String(err)}`)).ensureSummarySheet($('targetDate').value);
  }
  function processNext(startIndex) {
    let index=startIndex;
    while(index<queue.length && queue[index].kind==='done') index++;
    if (index>=queue.length) { finishBatch('一括処理が完了しました。'); return; }
    activeIndex=index; setItem(index,'PSA照合中…','running','');
    google.script.run.withSuccessHandler(psa=>{
      queue[index].psa=psa;
      setItem(index,'ALT成約を検索中…','running',`${psa.name} / ${psa.grade}`);
      const url=new URL(psa.altSearchUrl);
      url.searchParams.set('psaBatch','1'); url.searchParams.set('psaNonce',batchNonce); url.searchParams.set('psaName',psa.name);
      if (!popup || popup.closed) { setItem(index,'保留','hold','ALT検索ウィンドウが閉じられました。'); return processNext(index+1); }
      popup.location.href=url.href;
      clearTimeout(activeTimer);
      activeTimer=setTimeout(()=>{
        if (!busy || activeIndex!==index) return;
        setItem(index,'保留','hold','ALTから応答がありません。Tampermonkey、ALTログイン状態、ポップアップを確認してください。');
        processNext(index+1);
      },90000);
    }).withFailureHandler(err=>{
      setItem(index,'保留','hold',`PSA照合: ${err.message||String(err)}`); processNext(index+1);
    }).lookupPsaCert(queue[index].cert);
  }
  function onAltResult(event) {
    const data=event.data;
    if (!busy || event.origin!=='https://alt.xyz' || event.source!==popup || !data || data.type!=='PSA_ALT_BATCH_RESULT' || data.nonce!==batchNonce || activeIndex<0) return;
    clearTimeout(activeTimer);
    const index=activeIndex, psa=queue[index].psa;
    if (String(data.cert)!==psa.cert || String(data.grade)!==psa.grade) {
      setItem(index,'保留','hold','ALTの鑑定番号またはPSAグレードが一致しません。'); return processNext(index+1);
    }
    if (!data.ok) { setItem(index,'保留','hold',data.reason||'ALTで条件一致の成約2件を確認できませんでした。'); return processNext(index+1); }
    const sales=Array.isArray(data.sales)?data.sales:[];
    if (sales.length<2) { setItem(index,'保留','hold','ALTの一致成約が2件未満です。価格は記入していません。'); return processNext(index+1); }
    const lines=[['#ALT_META',data.title||psa.name,data.grade,data.url,data.cert].join('\t'),...sales.slice(0,2).map(s=>[s.date,s.price,s.site,s.url].join('\t'))].join('\n');
    setItem(index,'シート記入中…','running',`${sales[0].date} $${sales[0].price} / ${sales[1].date} $${sales[1].price}`);
    google.script.run.withSuccessHandler(result=>{
      setItem(index,'反映済み','done',`${result.sheet} ${result.row}行目 / ${psa.name} / ${psa.grade} / 採用 $${result.adopted}`);
      processNext(index+1);
    }).withFailureHandler(err=>{
      setItem(index,'保留','hold',`シート記入: ${err.message||String(err)}`); processNext(index+1);
    }).writePricedCard({cert:psa.cert,targetSheet,altData:lines,matchConfirmed:true});
  }
  function finishBatch(message) {
    clearTimeout(activeTimer);
    busy=false; activeIndex=-1; $('processButton').disabled=false; $('addButton').disabled=false;
    if (popup && !popup.closed) popup.close(); popup=null; renderQueue();
    const done=queue.filter(x=>x.kind==='done').length, held=queue.filter(x=>x.kind==='hold').length;
    say(`${message}\n反映 ${done}件 / 保留 ${held}件。保留理由は各番号の下に表示しています。`,held?'':'success'); $('cert').focus();
  }
  window.addEventListener('message',onAltResult);
  $('cert').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCert();}});
  init();
</script>
</body>
</html>
